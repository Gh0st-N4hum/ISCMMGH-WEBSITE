<!doctype html>
<html><head><meta charset="utf-8"><title>Hospital Specialty SVG Set</title>
<style>body{font-family:Arial,sans-serif;background:#f5f8fa;margin:0;padding:40px;color:#183b40}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;max-width:1200px;margin:auto}
.card{background:white;border-radius:18px;padding:18px;text-align:center;box-shadow:0 6px 20px #0001}
img{width:150px;height:150px}.tree{max-width:1400px;margin:40px auto;background:white;padding:20px;border-radius:18px}
</style></head><body><h1>Hospital Specialties</h1><div class="grid"><div class="card"><img src="cardiology.svg" alt="Cardiology"><h3>Cardiology</h3></div><div class="card"><img src="pulmonology.svg" alt="Pulmonology"><h3>Pulmonology</h3></div><div class="card"><img src="pediatrics.svg" alt="Pediatrics"><h3>Pediatrics</h3></div><div class="card"><img src="general-surgery.svg" alt="General Surgery"><h3>General Surgery</h3></div><div class="card"><img src="internal-medicine.svg" alt="Internal Medicine"><h3>Internal Medicine</h3></div><div class="card"><img src="ob-gyn.svg" alt="OB-GYN"><h3>OB-GYN</h3></div><div class="card"><img src="orthopedics.svg" alt="Orthopedics"><h3>Orthopedics</h3></div><div class="card"><img src="dermatology.svg" alt="Dermatology"><h3>Dermatology</h3></div><div class="card"><img src="ent.svg" alt="ENT / Otolaryngology"><h3>ENT / Otolaryngology</h3></div><div class="card"><img src="other.svg" alt="Other"><h3>Other</h3></div></div><div class="tree"><h2>Binary-tree-inspired navigation</h2><img src="specialization_binary_tree.svg" style="width:100%;height:auto"></div></body></html>
